<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Thermal Expressácil</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <a href="index.html" class="login-logo">
                <span>♥</span>
                Thermal Express
            </a>

            <div class="login-header">
                <h1>Bem-vindo de volta</h1>
                <p>Entre na sua conta para continuar.</p>
            </div>

            <form class="login-form">

                <label for="email">
                    E-mail
                </label>

                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

                <label for="senha">
                    Senha
                </label>

                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="esqueci-senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>

            </form>

            <div class="login-divider">
                <span>ou</span>
            </div>

            <p class="register-text">
                Para registrar ONGs ou colaboradores, entre em contato com a equipe do Thermal Express. <br>
                <a href="contato.html">Contato</a>
            </p>

            <a href="index.html" class="back-site">
                ← Voltar para o site
            </a>

        </section>

    </main>

</body>

</html>
